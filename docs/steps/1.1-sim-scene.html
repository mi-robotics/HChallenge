<title>Step 1.1 · Sim Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single column. Title, the task video, then the files that produced it */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1a1e26; --muted: #5d6573; --line: #dde1e8; --accent: #2d4fd0;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #98a0ae; --line: #2c323d; --accent: #8aa2ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #98a0ae; --line: #2c323d; --accent: #8aa2ff; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--display); padding-inline: 16px; padding-block: 40px 64px; }
main { max-width: 36rem; margin: 0 auto; display: grid; gap: 28px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(28px, 6vw, 38px)/1.1 var(--display); margin: 10px 0 0; text-wrap: balance; }
video { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.files { list-style: none; margin: 0; padding: 0; display: grid; }
.files li { display: grid; grid-template-columns: minmax(0, 13rem) 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.files a { font: 13.5px var(--mono); color: var(--accent); overflow-wrap: anywhere; }
.files a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.files span { color: var(--muted); }
@media (max-width: 480px) { .files li { grid-template-columns: 1fr; gap: 2px; } }
</style>

<main>
  <header>
    <span class="eyebrow">Step 1.1 · Phase 1</span>
    <h1>Sim scene: Panda, table, cup, plate</h1>
  </header>

  <video src="media/phase1/task1/cup_on_plate.mp4" controls autoplay muted loop playsinline aria-label="Panda arm grasps the red mug by its rim, lifts it and sets it upright on the plate."></video>

  <ul class="files">
    <li><a href="https://github.com/mi-robotics/HumanoidsChallenge/blob/main/sim/cup_on_plate.bddl" target="_blank" rel="noopener">sim/cup_on_plate.bddl</a><span>LIBERO task: table, mug, plate, success condition</span></li>
    <li><a href="https://github.com/mi-robotics/HumanoidsChallenge/blob/main/sim/scene.py" target="_blank" rel="noopener">sim/scene.py</a><span>Env setup, move_to, set_gripper; running it makes this video</span></li>
    <li><a href="https://github.com/mi-robotics/HumanoidsChallenge/blob/main/requirements.txt" target="_blank" rel="noopener">requirements.txt</a><span>Sim dependencies</span></li>
    <li><a href="https://github.com/mi-robotics/HumanoidsChallenge/blob/main/media/phase1/task1/cup_on_plate.mp4" target="_blank" rel="noopener">media/phase1/task1/cup_on_plate.mp4</a><span>This video</span></li>
  </ul>
</main>
