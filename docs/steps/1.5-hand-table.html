<title>Step 1.5 · Hand in Table Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single column. Title, the result image, then the files that produced it */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1a1e26; --muted: #5d6573; --line: #dde1e8; --accent: #2d4fd0;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #98a0ae; --line: #2c323d; --accent: #8aa2ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #98a0ae; --line: #2c323d; --accent: #8aa2ff; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--display); padding-inline: 16px; padding-block: 40px 64px; }
main { max-width: 56rem; margin: 0 auto; display: grid; gap: 28px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(28px, 6vw, 38px)/1.1 var(--display); margin: 10px 0 0; text-wrap: balance; }
img.result { display: block; width: 100%; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.files { list-style: none; margin: 0; padding: 0; display: grid; }
.files li { display: grid; grid-template-columns: minmax(0, 13rem) 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.files a { font: 13.5px var(--mono); color: var(--accent); overflow-wrap: anywhere; }
.files a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.files span { color: var(--muted); }
@media (max-width: 480px) { .files li { grid-template-columns: 1fr; gap: 2px; } }
</style>

<main>
  <header>
    <span class="eyebrow">Step 1.5 · Phase 1</span>
    <h1>Hand positions in table coordinates</h1>
  </header>

  <img class="result" src="media/phase1/task5/hand_table.png" alt="Left: top-down wrist paths of the five demos in the table frame, 25 to 80 cm to the side of the marker. Right: wrist height and lowest hand point over time; the wrist stays 15 to 28 cm above the table, fingertips drop to 5 to 10 cm while grasping, with a few single-frame dips below zero.">

  <ul class="files">
    <li><a href="https://github.com/mi-robotics/HChallenge/blob/main/replay/to_table.py" target="_blank" rel="noopener">replay/to_table.py</a><span>Pixels + D405 depth → camera 3D → table frame (one marker pose per demo); checks and this plot</span></li>
    <li><a href="https://github.com/mi-robotics/HChallenge/blob/main/calibration/markers.py" target="_blank" rel="noopener">calibration/markers.py</a><span>Table-marker pose</span></li>
    <li><a href="https://github.com/mi-robotics/HChallenge/blob/main/media/phase1/task5/hand_table.png" target="_blank" rel="noopener">media/phase1/task5/hand_table.png</a><span>This plot</span></li>
  </ul>
</main>
