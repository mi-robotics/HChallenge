<title>Step 3.5 · Flow Visualiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: single column. Title, the trajectory plot, then the files */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1a1e26; --muted: #5d6573; --line: #dde1e8; --accent: #2d4fd0;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #98a0ae; --line: #2c323d; --accent: #8aa2ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #98a0ae; --line: #2c323d; --accent: #8aa2ff; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--display); padding-inline: 16px; padding-block: 40px 64px; }
main { max-width: 56rem; margin: 0 auto; display: grid; gap: 28px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(28px, 6vw, 38px)/1.1 var(--display); margin: 10px 0 0; text-wrap: balance; }
pre { margin: 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font: 13.5px/1.6 var(--mono); overflow-x: auto; }
figcaption { font: 13px/1.5 var(--mono); color: var(--muted); }
figure { margin: 0; display: grid; gap: 8px; }
video { display: block; width: 100%; max-width: 100%; aspect-ratio: 8 / 3; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
img.result { display: block; width: 100%; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.files { list-style: none; margin: 0; padding: 0; display: grid; }
.files li { display: grid; grid-template-columns: minmax(0, 13rem) 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.files a { font: 13.5px var(--mono); color: var(--accent); overflow-wrap: anywhere; }
.files a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.files span { color: var(--muted); }
@media (max-width: 480px) { .files li { grid-template-columns: 1fr; gap: 2px; } }
</style>

<main>
  <header>
    <span class="eyebrow">Step 3.5 · Phase 3</span>
    <h1>Flow drawn on the video</h1>
  </header>

  <figure>
    <video src="media/phase3/task5/flow.mp4" controls autoplay muted loop playsinline aria-label="Five demo videos tiled with a legend; at every frame the next 1.5 seconds of motion of the hand points and mug points are drawn as trails, with hidden steps in red."></video>
    <figcaption>At every frame: the flow sample that starts there, the next 16 steps (1.5 s) of the 6 hand and 8 mug points. Red = hidden steps (interpolated).</figcaption>
  </figure>

  <ul class="files">
    <li><a href="https://github.com/mi-robotics/HumanoidsChallenge/blob/main/flow/visualise.py" target="_blank" rel="noopener">flow/visualise.py</a><span>Draws flow.npz on the video; writes this video</span></li>
    <li><a href="https://github.com/mi-robotics/HumanoidsChallenge/blob/main/flow/FORMAT.md" target="_blank" rel="noopener">flow/FORMAT.md</a><span>The format</span></li>
    <li><a href="https://github.com/mi-robotics/HumanoidsChallenge/blob/main/media/phase3/task5/flow.mp4" target="_blank" rel="noopener">media/phase3/task5/flow.mp4</a><span>This video</span></li>
  </ul>
</main>
