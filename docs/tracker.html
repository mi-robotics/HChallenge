<title>HumanoidsChallenge Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: status board. Overall progress up top, pipeline strip of phases, then one checklist block per phase, step log at the end */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1a1e26; --muted: #5d6573; --line: #dde1e8;
  --accent: #2d4fd0; --accent-soft: #e3e9fb; --ok: #1d7a4a; --ok-soft: #e1f2e8; --warn: #a65b00; --warn-soft: #fbeedb;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #98a0ae; --line: #2c323d;
  --accent: #8aa2ff; --accent-soft: #232c4a; --ok: #5cc78e; --ok-soft: #183326; --warn: #f0a646; --warn-soft: #3a2a14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #98a0ae; --line: #2c323d;
  --accent: #8aa2ff; --accent-soft: #232c4a; --ok: #5cc78e; --ok-soft: #183326; --warn: #f0a646; --warn-soft: #3a2a14; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--display); padding-inline: 16px; padding-block: 32px 56px; }
main { max-width: 60rem; margin: 0 auto; display: grid; gap: 28px; }
.label { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(26px, 5vw, 36px)/1.1 var(--display); margin: 6px 0 0; text-wrap: balance; }
h2 { font: 700 17px/1.3 var(--display); margin: 0; }



.overall { display: grid; gap: 8px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.overall .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.strip a { text-decoration: none; color: inherit; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 10px; display: grid; gap: 6px; min-width: 0; }
.strip a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.strip .n { font: 500 11px var(--mono); color: var(--muted); }
.strip .nm { font-weight: 700; font-size: 13px; line-height: 1.25; }
.strip a[data-s="done"] { border-color: var(--ok); }
.strip a[data-s="active"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
@media (max-width: 760px) { .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.pill { font: 500 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; justify-self: start; white-space: nowrap; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.active { background: var(--accent-soft); color: var(--accent); }
.pill.todo { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.risk { background: var(--warn-soft); color: var(--warn); }


.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); gap: 14px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.phase header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.phase .goal { color: var(--muted); font-size: 14px; }
.phase ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.phase li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 14px; }
.box { width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 3px; margin-top: 3px; display: grid; place-items: center; }
li.on .box { background: var(--ok); border-color: var(--ok); }
li.on .box::after { content: ""; width: 6px; height: 3px; border: solid var(--surface); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
li.on span:last-child { color: var(--muted); }
.count { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.log { width: 100%; border-collapse: collapse; font-size: 14px; }
.log th { text-align: left; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); }
.log td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.log td.m { font-family: var(--mono); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
a { color: var(--accent); }
</style>

<main>
  <div class="top">
    <div>
      <span class="label">Humanoid · Robot Learning Internship Challenge</span>
      <h1>Human video → action flow → robot in sim</h1>
    </div>
  </div>

  <div class="overall">
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="row"><span id="summary">0 of 0 checks done</span><span>Updated 8 Oct 2026 · after step 00</span></div>
  </div>

  <nav class="strip" id="strip" aria-label="Phases"></nav>

  <section class="phases" id="phases"></section>

  <section style="display:grid;gap:10px">
    <h2>Step log</h2>
    <div class="tablewrap"><table class="log">
      <thead><tr><th>Step</th><th>Date</th><th>What happened</th><th>Report</th></tr></thead>
      <tbody id="log"></tbody>
    </table></div>
  </section>
</main>

<script>
// Status per phase: done | active | todo. Items mirror the checkboxes in PROJECT_PLAN.md.
const PHASES = [
  { id: "p0", n: "0", name: "Setup", status: "done", goal: "Repo, environment and working rules.", items: [
    ["GitHub repo connected and pushed", 1], ["Conda env humanoidschallenge (Python 3.10)", 1], ["CLAUDE.md written", 1], ["Tracker and step reports started", 1] ] },
  { id: "p1", n: "1", name: "Video → sim replay", status: "active", goal: "Make the sim robot copy one recorded hand video, offline.", items: [
    ["Sim scene works; gripper moves to target positions", 0], ["Hand positions in table coordinates (land on the table)", 0], ["Sim robot follows the motion from the video", 0], ["Side-by-side video: real demo | sim replay", 0] ] },
  { id: "p2", n: "2", name: "Live teleop", status: "todo", goal: "Move my hand in front of the camera; the sim robot follows in real time.", items: [
    ["Robot follows hand live, under ~200 ms lag", 0], ["Can push the sim cup onto the sim plate", 0], ["Recording saves an episode to disk", 0], ["Screen recording of live teleop", 0] ] },
  { id: "p3", n: "3", name: "Action flows", status: "todo", goal: "Turn videos into point trails in one fixed format.", items: [
    ["flow/FORMAT.md exists; all scripts use it", 0], ["Hand and cup flow extracted from any video", 0], ["Visualiser trails match what the hand did", 0], ["Slicing function produces training samples", 0] ] },
  { id: "p4", n: "4", name: "Data collection", status: "todo", goal: "Record a paired real + sim dataset with teleop.", items: [
    ["Flow extraction run on all episodes", 0], ["Drifted episodes dropped", 0], ["Train / val / test split by episode", 0], ["Held-out cup positions in test only", 0], ["data/README.md written", 0] ] },
  { id: "p5", n: "5", name: "Flow → action policy", status: "todo", goal: "Policy that turns action flow into robot actions in sim.", items: [
    ["Baseline: hand-coded retargeting", 0], ["Learned policy vs baseline", 0], ["Ablation: hand vs cup vs both flows", 0], ["Robustness to flow noise", 0], ["Results table", 0], ["Success and failure videos", 0] ] },
  { id: "p6", n: "6", name: "Flow generator", status: "todo", goal: "Real photo + instruction → predicted hand flow.", items: [
    ["Predicted trails look sensible on test photos", 0], ["End-to-end success rate reported", 0], ["Hero demo video", 0] ] },
  { id: "p7", n: "W", name: "Write-up", status: "todo", goal: "Short, specific, honest README for reviewers.", items: [
    ["Summary + hero GIF", 0], ["Pipeline diagram", 0], ["How to run", 0], ["Results tables", 0], ["Design choices and why", 0], ["What worked, what didn't, what's next", 0], ["Failure videos", 0] ] },
];

const STEPS = [
  { n: "00", date: "8 Oct", what: "Repo, conda env, CLAUDE.md, tracker and step reports.", url: "https://claude.ai/artifact/4LuyL24MuyqkmJNkJrxKCV" },
];

const PILL = { done: "Done", active: "In progress", todo: "Not started" };
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

let total = 0, done = 0;
document.getElementById("strip").innerHTML = PHASES.map(p =>
  `<a href="#${p.id}" data-s="${p.status}"><span class="n">${p.n === "W" ? "Final" : "Phase " + p.n}</span><span class="nm">${esc(p.name)}</span><span class="pill ${p.status}">${PILL[p.status]}</span></a>`).join("");

document.getElementById("phases").innerHTML = PHASES.map(p => {
  const d = p.items.filter(i => i[1]).length;
  total += p.items.length; done += d;
  return `<article class="phase" id="${p.id}">
    <header><h2>${p.n === "W" ? "" : p.n + " · "}${esc(p.name)}</h2><span class="count">${d}/${p.items.length}</span></header>
    <p class="goal">${esc(p.goal)}</p>
    <ul>${p.items.map(([t, on]) => `<li class="${on ? "on" : ""}"><span class="box" aria-hidden="true"></span><span>${esc(t)}</span></li>`).join("")}</ul>
  </article>`;
}).join("");

document.getElementById("bar").style.width = (100 * done / total).toFixed(1) + "%";
document.getElementById("summary").textContent = `${done} of ${total} checks done`;

document.getElementById("log").innerHTML = STEPS.map(s =>
  `<tr><td class="m">${s.n}</td><td class="m">${s.date}</td><td>${esc(s.what)}</td><td><a href="${s.url}" target="_blank" rel="noopener">Open</a></td></tr>`).join("");

</script>
