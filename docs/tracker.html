<title>HumanoidsChallenge Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: status board. Overall progress up top, pipeline strip of phases, then one block per phase listing its steps; each step is a checkpoint with its own report link */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --fg: #1a1e26; --muted: #5d6573; --line: #dde1e8;
  --accent: #2d4fd0; --accent-soft: #e3e9fb; --ok: #1d7a4a; --ok-soft: #e1f2e8; --warn: #a65b00; --warn-soft: #fbeedb;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #98a0ae; --line: #2c323d;
  --accent: #8aa2ff; --accent-soft: #232c4a; --ok: #5cc78e; --ok-soft: #183326; --warn: #f0a646; --warn-soft: #3a2a14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #98a0ae; --line: #2c323d;
  --accent: #8aa2ff; --accent-soft: #232c4a; --ok: #5cc78e; --ok-soft: #183326; --warn: #f0a646; --warn-soft: #3a2a14; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--display); padding-inline: 16px; padding-block: 32px 56px; }
main { max-width: 60rem; margin: 0 auto; display: grid; gap: 28px; }
.label { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(26px, 5vw, 36px)/1.1 var(--display); margin: 6px 0 0; text-wrap: balance; }
h2 { font: 700 17px/1.3 var(--display); margin: 0; }



.overall { display: grid; gap: 8px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.overall .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.strip a { text-decoration: none; color: inherit; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 10px; display: grid; gap: 6px; min-width: 0; }
.strip a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.strip .n { font: 500 11px var(--mono); color: var(--muted); }
.strip .nm { font-weight: 700; font-size: 13px; line-height: 1.25; }
.strip a[data-s="done"] { border-color: var(--ok); }
.strip a[data-s="active"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
@media (max-width: 760px) { .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.pill { font: 500 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; justify-self: start; white-space: nowrap; }
.pill.done { background: var(--ok-soft); color: var(--ok); }
.pill.active { background: var(--accent-soft); color: var(--accent); }
.pill.todo { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill.dropped { background: var(--bg); color: var(--muted); border: 1px dashed var(--line); }
.strip a[data-s="dropped"] { border-style: dashed; }
.strip a[data-s="dropped"] .nm { color: var(--muted); text-decoration: line-through; }

.phases { display: grid; gap: 14px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.phase header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.phase .goal { color: var(--muted); font-size: 14px; margin: -8px 0 0; }
.phase ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.phase li { display: grid; grid-template-columns: 18px 2.6rem 1fr auto; gap: 8px; align-items: start; font-size: 14px; padding: 6px 8px; border-radius: 4px; }
.phase li.next { background: var(--accent-soft); }
.num { font: 500 12px/20px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
li.next .num, li.next .txt { color: var(--accent); font-weight: 700; }
li.done .txt { color: var(--muted); }
.doc { font: 12px/20px var(--mono); white-space: nowrap; color: var(--muted); }
a.doc { color: var(--accent); }
.box { width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 3px; margin-top: 3px; display: grid; place-items: center; }
li.next .box { border-color: var(--accent); }
li.done .box { background: var(--ok); border-color: var(--ok); }
li.done .box::after { content: ""; width: 6px; height: 3px; border: solid var(--surface); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
@media (max-width: 520px) { .phase li { grid-template-columns: 18px 2.4rem 1fr; } .doc { grid-column: 3; } }
.count { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.tablewrap { overflow-x: auto; }
a { color: var(--accent); }
</style>

<main>
  <div class="top">
    <div>
      <span class="label">Humanoid · Robot Learning Internship Challenge</span>
      <h1>Human video → action flow → robot in sim</h1>
    </div>
  </div>

  <div class="overall">
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="row"><span id="summary">0 of 0 steps done</span><span>Updated 8 Oct 2026 · pick-and-place since 1.1 · D405 camera since 1.2 · live teleop dropped after 1.9</span></div>
  </div>

  <nav class="strip" id="strip" aria-label="Phases"></nav>

  <section class="phases" id="phases"></section>

</main>

<script>
// Mirrors the numbered steps in PROJECT_PLAN.md. Each step is a checkpoint with its own report.
// steps: [text, state, reportUrl?]; state 0 = todo, 1 = done, 2 = next up.
const PHASES = [
  { id: "p0", n: "0", name: "Setup", status: "done", goal: "Repo, environment and working rules.",
    steps: [["Progress tracker", 1, "https://claude.ai/artifact/4LuyL24MuyqkmJNkJrxKCV"], ["Per-step documentation pages", 1, "https://claude.ai/artifact/4LuyL24MuyqkmJNkJrxKCV"], ["GitHub repo set up and pushed", 1, "https://claude.ai/artifact/4LuyL24MuyqkmJNkJrxKCV"],
      ["Conda env humanoidschallenge (Python 3.10)", 1, "https://claude.ai/artifact/4LuyL24MuyqkmJNkJrxKCV"], ["CLAUDE.md", 1, "https://claude.ai/artifact/4LuyL24MuyqkmJNkJrxKCV"]] },
  { id: "p1", n: "1", name: "Video → sim replay", status: "done", goal: "Make the sim robot copy one recorded hand video, offline.",
    steps: [["Set up the sim scene: Panda, table, cup, plate; move gripper to targets, open/close", 1, "https://claude.ai/artifact/Cjd2LLGLv7cKccCVsHxw1W"],
      ["Print and place the ArUco marker; set up the D405 camera and check its calibration", 1, "https://claude.ai/artifact/7SWiSAHz8QBr4RQkMVcQMZ"],
      ["Record 5 demos (10–11 s each) of putting the cup on the plate, marker visible", 1, "https://claude.ai/artifact/5rmHn2uvxA55FzQHfnjYBA"],
      ["Track the hand in every frame with MediaPipe (wrist, fingertips)", 1, "https://claude.ai/artifact/8VzybS8sxqCyzNhjJ23oz3"],
      ["Convert to table coordinates (cm) using the marker", 1, "https://claude.ai/artifact/J41NNxQDPJzv28C2oEr7w5"],
      ["Smooth and resample the trajectory to 20 Hz", 1, "https://claude.ai/artifact/J47Dwz2vAAah6iXkv1pace"],
      ["Map hand → robot: pinch point → gripper position, thumb–index distance → open/close", 1, "https://claude.ai/artifact/2UR5NA4hvd9SNkgii1PgN6"],
      ["Match the starting scene: place the sim cup and plate as in the demo", 1, "https://claude.ai/artifact/GqMHUqw7wyUM2DW5EAmVZq"],
      ["Replay in sim and record a video", 1, "https://claude.ai/artifact/CdFosei9oY3gAxBuhH4dc7"]] },
  { id: "p2", n: "2", name: "Live teleop", status: "dropped", goal: "Dropped after step 1.9: offline replay of recorded videos already puts the cup on the plate (5/5), so the dataset's sim actions come from replay instead of live teleop.",
    steps: [] },
  { id: "p3", n: "3", name: "Action flows", status: "done", goal: "Turn videos into point trails in one fixed format.",
    steps: [["Define the flow format in flow/FORMAT.md ([points, T, 4], T = 16 at 10 Hz)", 1, "https://claude.ai/artifact/JmAsBvaDwyKcB7EieZRDDg"], ["Run CoTracker on recorded videos", 1, "https://claude.ai/artifact/LaaJqCtvNkpkfA1HfNLd88"], ["Convert trails to table coordinates", 1, "https://claude.ai/artifact/H4A8LG6Z4iq9asbiJe31D4"],
      ["Track points on the cup (object flow)", 1, "https://claude.ai/artifact/Nfg5n9g2fmH51C4eFH9RpQ"], ["Write a visualiser that draws trails on the video", 1, "https://claude.ai/artifact/J8v6oRAcY9ktXydHY4pK6g"]] },
  { id: "p4", n: "4", name: "Data collection", status: "active", goal: "Record 50–100 videos, replay each in sim, keep the episodes where the sim cup ends on the plate.",
    steps: [["Record episodes, cup and plate in a new position each time", 1, "https://claude.ai/artifact/G423AJDd5C5MbiEGdRy2it"], ["Run the Phase 1 pipeline on every episode", 2],
      ["Replay each episode in sim, saving actions, robot state and images per step", 0], ["Keep the successful replays; note what was dropped and why", 0],
      ["Extract hand and cup flow for the kept episodes", 0], ["Split by episode into train / val / test; write data/README.md", 0]] },
  { id: "p5", n: "5", name: "Flow → action policy", status: "todo", goal: "Policy that turns action flow into robot actions in sim.",
    steps: [["Build the training dataset: slice episodes into samples (flow from step s, aligned to the sim replay) with sim obs and robot actions", 0], ["Train the simple baseline (flow + state → actions)", 0], ["Train the main policy (ACT or diffusion) on Colab", 0], ["Evaluate in sim on held-out recorded flows", 0]] },
  { id: "p6", n: "6", name: "Flow generator", status: "todo", goal: "Real photo + instruction → predicted hand flow.",
    steps: [["Build the dataset: (image, instruction) → hand flow", 0], ["Train the simple version (frozen DINOv2 + text + head)", 0], ["Upgrade to diffusion only if predictions are averaged", 0], ["End-to-end test: photo → generator → policy → sim", 0]] },
  { id: "p7", n: "W", name: "Write-up", status: "todo", goal: "Short, specific, honest README for reviewers.",
    steps: [["Summary + hero GIF", 0], ["Pipeline diagram", 0], ["How to run", 0], ["Results tables", 0], ["Design choices and why", 0], ["What worked, what didn't, what's next", 0], ["Failure videos", 0]] },
];

const PILL = { done: "Done", active: "In progress", todo: "Not started", dropped: "Dropped" };
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

let total = 0, done = 0;
document.getElementById("strip").innerHTML = PHASES.map(p =>
  `<a href="#${p.id}" data-s="${p.status}"><span class="n">${p.n === "W" ? "Final" : "Phase " + p.n}</span><span class="nm">${esc(p.name)}</span><span class="pill ${p.status}">${PILL[p.status]}</span></a>`).join("");

const STATE = ["todo", "done", "next"];
let nextUp = "";
document.getElementById("phases").innerHTML = PHASES.map(p => {
  const d = p.steps.filter(x => x[1] === 1).length;
  total += p.steps.length; done += d;
  const steps = p.steps.map(([t, st, url], i) => {
    const id = p.n === "W" ? "W." + (i + 1) : p.n + "." + (i + 1);
    if (st === 2) nextUp = id;
    const doc = url ? `<a class="doc" href="${url}" target="_blank" rel="noopener">report ↗</a>` : `<span class="doc">no report yet</span>`;
    return `<li class="${STATE[st]}"><span class="box" aria-hidden="true"></span><span class="num">${id}</span><span class="txt">${esc(t)}</span>${doc}</li>`;
  }).join("");
  return `<article class="phase" id="${p.id}">
    <header><h2>${p.n === "W" ? "" : "Phase " + p.n + " · "}${esc(p.name)}</h2><span class="count">${p.steps.length ? d + "/" + p.steps.length + " steps" : PILL[p.status]}</span></header>
    <p class="goal">${esc(p.goal)}</p>
    ${steps ? `<ol>${steps}</ol>` : ""}
  </article>`;
}).join("");

document.getElementById("bar").style.width = (100 * done / total).toFixed(1) + "%";
document.getElementById("summary").textContent = `${done} of ${total} steps done` + (nextUp ? ` · next: ${nextUp}` : "");


</script>
